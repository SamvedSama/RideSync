spring:
  datasource:
    url: jdbc:h2:file:./data/ridesync_db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

app:
  jwt:
    secret: RideSyncSuperSecretKeyForJWTSigningThatIsAtLeast256BitsLong1234567890
    expiration-ms: 86400000 # 24 hours

server:
  port: 8080
