<!DOCTYPE html>
<html>
<head>
    <title>RideSync Tracker</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        body { padding: 0; margin: 0; }
        html, body, #map { height: 100%; width: 100vw; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Central default mapping to Bengaluru.
        var map = L.map('map').setView([12.9716, 77.5946], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var driverMarker;

        // Exposed Function for Java to Call to pan Map
        function updateDriverLocation(lat, lng) {
            var newLatLng = new L.LatLng(lat, lng);
            if (!driverMarker) {
                driverMarker = L.marker(newLatLng).addTo(map)
                    .bindPopup('<b>Driver</b><br />Active Location').openPopup();
            } else {
                driverMarker.setLatLng(newLatLng);
            }
            map.panTo(newLatLng);
        }
    </script>
</body>
</html>
